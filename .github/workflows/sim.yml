name: simulator
on:
  pull_request:
  push:
    branches: [nightly]
permissions:
  contents: read
jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pass path and blocked paths
        run: bash sim/test_scenarios.sh
